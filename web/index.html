<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>资源管理 · 本地知识库</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="brand">资源管理 <span class="sub">本地知识库</span></div>
  <nav class="crumb" id="crumb"></nav>
  <div class="spacer"></div>
  <div class="search-wrap">
    <input id="search" class="search" placeholder="搜索文件名 / 关键词…">
    <button id="btn-ask-search" class="btn small" title="用 AI 基于当前范围回答">问 AI</button>
  </div>
  <button id="btn-login" class="btn">QQ 登录</button>
  <button id="btn-refresh" class="btn">刷新来源</button>
  <button id="btn-groups" class="btn">群聊</button>
  <button id="btn-settings" class="btn">设置</button>
</header>

<div id="setup-banner" class="setup-banner hidden"></div>

<section class="vault-strip" id="vault-strip">
  <div class="vs-head">
    <div class="vs-title">Obsidian 知识库 <span class="vs-sub">完整链路 · 自动分类</span></div>
    <div class="vs-path" id="vault-path" title="点击复制库路径">读取中…</div>
  </div>
  <div class="vs-flow">
    <span class="vs-step"><i>1</i>分类整理</span><span class="vs-arrow">→</span>
    <span class="vs-step"><i>2</i>一键批量导入</span><span class="vs-arrow">→</span>
    <span class="vs-step"><i>3</i>自动分类入库</span><span class="vs-arrow">→</span>
    <span class="vs-step"><i>4</i>Obsidian 打开 + AI 检索</span>
  </div>
  <div class="vs-foot">
    <div class="vs-stat" id="vault-stat">正在读取库状态…</div>
    <div class="row gap">
      <button id="btn-vault-import" class="btn small primary">一键批量导入到 Obsidian</button>
      <button id="btn-vault-search" class="btn small">库内 AI 检索</button>
      <button id="btn-vault-open" class="btn small">打开库文件夹</button>
      <button id="btn-vault-init" class="btn small">初始化 / 重建大纲</button>
    </div>
  </div>
  <div class="vs-note" id="vault-note">下载后自动抽取正文、生成摘要，并按「来源 / 群聊 / 领域 / 学科 / 类型」落盘，同时生成预览笔记与多级大纲。</div>
</section>

<div class="layout">
  <aside class="left">
    <section class="card">
      <div class="row between"><h3>分类方式</h3></div>
      <select id="dim" class="mini">
        <option value="subject" selected>按学科</option>
        <option value="kind">按类型</option>
        <option value="source">按来源</option>
      </select>
      <div class="row between" style="margin-top:10px"><span class="muted mini">群聊范围</span></div>
      <select id="group-focus" class="mini">
        <option value="">全部群聊</option>
      </select>
    </section>
    <section class="card grow">
      <div class="row between"><h3>分类大纲</h3><span class="muted mini" id="tree-hint">点击展开</span></div>
      <div id="tree" class="tree"></div>
    </section>
    <section class="card stats" id="stats"></section>
  </aside>

  <main class="center">
    <div class="row between head">
      <div><h2 id="node-title">全部资源</h2><div id="node-sub" class="muted"></div></div>
      <div class="row gap">
        <button id="btn-select-all" class="btn small">全选本页</button>
        <button id="btn-download-selected" class="btn small primary">下载已选</button>
        <button id="btn-download-category" class="btn small warn">整类下载</button>
      </div>
    </div>
    <div id="children" class="children"></div>
    <div class="kindbar" id="kindbar"></div>
    <div id="files" class="files"></div>
  </main>

  <aside class="right">
    <section class="card grow ai-card" id="ai-card">
      <div class="row between"><h3>AI 问答</h3><label class="mini"><input type="checkbox" id="fast"> 快速</label></div>
      <div class="muted" id="ai-scope" style="margin-bottom:6px">范围：全部</div>
      <div id="chat" class="chat"></div>
      <div class="row gap"><input id="ask" class="ask" placeholder="口语提问，如：高数期末真题有哪些？"><button id="btn-ask" class="btn primary small">提问</button></div>
      <div class="chips" id="chips"></div>
    </section>
  </aside>
</div>

<div id="modal" class="modal hidden"><div class="dialog" id="dialog"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>资源管理</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="brand">资源管理 <span class="sub">本地闭环</span></div>
  <nav class="crumb" id="crumb"></nav>
  <div class="spacer"></div>
  <div class="search-wrap">
    <input id="search" class="search" placeholder="搜索文件名 / 路径 / 摘要…">
    <button id="btn-ask-search" class="btn small" title="用 AI 基于当前范围回答这个查询">问 AI</button>
  </div>
  <button id="btn-ai" class="btn primary">AI 助手</button>
  <button id="btn-settings" class="btn">设置</button>
  <button id="btn-login" class="btn">QQ 登录</button>
  <button id="btn-wechat" class="btn">微信</button>
  <button id="btn-setup" class="btn">首次配置</button>
  <button id="btn-refresh" class="btn">刷新来源</button>
  <button id="btn-diagnose" class="btn">系统诊断</button>
</header>

<div id="setup-banner" class="setup-banner hidden"></div>

<div class="layout">
  <aside class="left">
    <section class="card">
      <h3>授权来源</h3>
      <div id="sources"></div>
      <div id="wechat-limits" class="limits"></div>
    </section>
    <section class="card grow">
      <div class="row between">
        <h3>分类大纲</h3>
        <select id="dim" class="mini">
          <option value="classify">按分类</option>
          <option value="tag">按主题标签（多归属）</option>
          <option value="source">按来源</option>
        </select>
      </div>
      <div id="tree" class="tree"></div>
    </section>
    <section class="card stats" id="stats"></section>
  </aside>

  <main class="center">
    <div class="row between head">
      <div><h2 id="node-title">全部资源</h2><div id="node-sub" class="muted"></div></div>
      <div class="row gap">
        <button id="btn-select-all" class="btn small">全选本页</button>
        <button id="btn-download-selected" class="btn small primary">下载已选</button>
        <button id="btn-download-category" class="btn small warn">整类下载</button>
      </div>
    </div>
    <div id="children" class="children"></div>
    <div class="kindbar" id="kindbar"></div>
    <div id="files" class="files"></div>
  </main>

  <aside class="right">
    <section class="card" id="preview-card">
      <h3>单文件预览</h3>
      <div id="preview" class="muted">点击列表中的「预览」查看</div>
    </section>
    <section class="card grow ai-card" id="ai-card">
      <div class="row between"><h3>AI 助手</h3><label class="mini"><input type="checkbox" id="fast"> 快速模式</label></div>
      <div class="muted" id="ai-scope" style="margin-bottom:6px">当前范围：全部</div>
      <div id="chat" class="chat"></div>
      <div class="row gap"><input id="ask" class="ask" placeholder="口语化提问，如：有哪些高数真题还没下载？"><button id="btn-ask" class="btn primary small">提问</button></div>
      <div class="chips" id="chips"></div>
    </section>
  </aside>
</div>

<div id="modal" class="modal hidden"><div class="dialog" id="dialog"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="/app.js"></script>
</body>
</html>
